<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World characters</title>
</head>
<body>
  <div id="demo"></div>
  <script>
    // raf=0: hidden capture windows get no animation frames, so drive them from timers.
    if (/[?&]raf=0/.test(location.search)) window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  </script>
  <script type="module" src="/src/world/demo.ts"></script>
</body>
</html>
