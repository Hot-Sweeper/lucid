<!doctype html><html lang="en"><meta charset="utf-8"><title>Lucid question panel</title><body>
<script type="module">
import '@fontsource-variable/lexend';
import '@fontsource-variable/jetbrains-mono';
import '/src/styles.css';
import '/src/office/office.css';
import { MonitorTasks } from '/src/office/monitor-tasks.ts';
const params=new URLSearchParams(location.search), q=s=>document.querySelector(s), wait=ms=>new Promise(r=>setTimeout(r,ms));
document.body.style.cssText='display:grid;place-items:center;background:#b88762;overflow:hidden';
const screen=document.createElement('div');screen.style.cssText='position:relative;width:min(96vw,820px);height:461px;border:18px solid #282d40;border-radius:24px;overflow:hidden;box-sizing:content-box';document.body.append(screen);
const root=document.createElement('div');screen.append(root);
const labels=['Live desk and office changes','Both','Code updates without reopening'];
const question={id:'scope',header:'Live changes',question:'By “update in realtime,” do you mean desk moves and office changes appearing immediately, or new Lucid code updates loading without reopening the app?',options:labels.map(label=>({label,description:label,value:null})),multiSelect:false,allowCustomAnswer:true,initialAnswer:null};
let pending=[{id:'request',type:'input',at:'now',answerable:true,reason:null,questions:[question]}],responses=[];
const thread={id:'question-review',title:'Drag desks and threads',provider:'codex',runStatus:'waiting',question:question.question,settled:false};
const desk={threadId:thread.id,el:screen,screen,profile:{name:'Ratchet'},wm:{root,setOverlayCovered(){}}};
const world={desks:new Map([['a',desk]]),lastData:{threads:[thread]},setCompletionHolds(){}};
const tasks=new MonitorTasks(world,{answer:{pending:async()=>pending,t3:{status:async()=>({paired:true,error:null}),respond:async request=>{responses.push(request);throw Error('Test connection lost. Your answer is preserved.');}}},read(){},ready(){return null},collect:async()=>{}});
tasks.prepare(world.lastData);tasks.sync();await wait(300);await document.fonts.ready;
window.questionReview={tasks,world,desk,pending,responses};
if(params.has('selected')) q('.ca-opt input').click();
if(params.has('test')){
 const passed=[],check=(ok,label)=>{if(!ok)throw Error(label);passed.push(label)},inside=(el,parent)=>{const a=el.getBoundingClientRect(),b=parent.getBoundingClientRect();return a.top>=b.top-1&&a.bottom<=b.bottom+1&&a.left>=b.left-1&&a.right<=b.right+1;};
 try{
 check(inside(q('.ca-send'),screen),'Send answer visible without scrolling');
 check([...document.querySelectorAll('.ca-opt')].every(el=>inside(el,screen)),'Every choice and custom answer visible without scrolling');
 check(q('.monitor-task-body').scrollHeight<=q('.monitor-task-body').clientHeight+1,'No outer question scroll for the reference question');
 check(!q('.ca-desc'),'Repeated option descriptions omitted');
 const group=q('.ca-options').getBoundingClientRect(), area=q('.ca-content').getBoundingClientRect();
 check(area.bottom-group.bottom<=12&&area.bottom>=group.bottom,'Answer choices sit at the bottom next to the submit footer');
 check(group.top-q('legend').getBoundingClientRect().bottom>=12,'Question and answers retain a comfortable gap');

 const choices=[...document.querySelectorAll('.ca-opt')], first=choices[0], second=choices[1];
 const hit=row=>{const b=row.getBoundingClientRect();return document.elementFromPoint(b.right-12,b.top+b.height/2);};
 check(getComputedStyle(first.querySelector('input')).appearance==='none','Choice controls use the Lucid visual style');
 hit(second).click();check(second.querySelector('input').checked,'The empty right side of a choice activates its radio');
 check(choices.every(row=>row.getBoundingClientRect().height>=24),'Whole-row choice targets meet minimum size');
 const disabled=second.querySelector('input');hit(first).click();disabled.disabled=true;hit(second).click();check(!disabled.checked&&first.querySelector('input').checked,'Disabled choice cannot be selected through the row');disabled.disabled=false;
 const own=q('.ca-other .ca-text'), ownBox=own.getBoundingClientRect();
 check(document.elementFromPoint(ownBox.x+ownBox.width/2,ownBox.y+ownBox.height/2)===own,'Full-row label does not cover the custom answer field');
 const checkBox=first.querySelector('input');checkBox.type='checkbox';checkBox.checked=false;hit(first).click();check(checkBox.checked&&getComputedStyle(checkBox).borderRadius==='5px','Multiple-choice checkbox retains its native interaction and square shape');checkBox.type='radio';

 const radio=q('.ca-opt input');radio.click();q('.ca-send').click();await wait(100);
 check(responses.length===1&&responses[0].answers.scope===labels[0],'Selected answer reaches the real submission handler');
 check(radio.checked,'Failed send preserves selection');
 check(inside(q('.ca-state'),screen),'Retry error remains visible');
 // A much longer request scrolls its content while keeping actions on screen.
 const content=q('.ca-content');for(let i=0;i<8;i++){const p=document.createElement('p');p.textContent=question.question;content.append(p);}
 check(content.scrollHeight>content.clientHeight,'Long questions retain a usable scroll region');
 check(inside(q('.ca-send'),screen),'Long content cannot hide submission');
 content.scrollTop=content.scrollHeight;check(inside(q('.ca-send'),screen),'Submission remains visible after content scrolling');
 content.querySelectorAll(':scope > p:not(.ca-boss)').forEach(el=>el.remove());content.scrollTop=0;
 if(params.has('narrow')){screen.style.width='320px';await wait(100);check(q('.ca-content').scrollWidth<=q('.ca-content').clientWidth+1,'Narrow content has no horizontal overflow');check(inside(q('.ca-send'),screen),'Narrow submit visible');}
 document.title='PASS: '+passed.length+' question checks';
 await fetch('/__question_result',{method:'POST',body:JSON.stringify({ok:true,passed})});
 }catch(error){document.title='FAIL: '+error.message;await fetch('/__question_result',{method:'POST',body:JSON.stringify({ok:false,error:String(error),passed})});}
}
</script></body></html>
